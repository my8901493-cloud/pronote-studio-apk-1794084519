name: Build ProNote Studio Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false"
  GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Dorg.gradle.daemon=false"

jobs:
  build-android-apk:
    name: Compile Android APK via Capacitor & Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor & Sync Android Project
        run: |
          npm install --no-audit --no-fund
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Premium Pencil App Icons & Patch Native 120fps Bridge
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          if [ -d "android-res" ]; then
            cp -rf android-res/* android/app/src/main/res/
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "enableOnBackInvokedCallback" android/app/src/main/AndroidManifest.xml; then
              sed -i 's/<application/<application android:enableOnBackInvokedCallback="false" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml
            fi
          fi
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            echo "" | base64 -d > "$MAIN_ACT"
          fi
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties

      - name: Pre-Download Gradle 8.2.1 over IPv4
        run: |
          GRADLE_URL=$(grep "distributionUrl=" android/gradle/wrapper/gradle-wrapper.properties | cut -d"=" -f2 | tr -d '\\' | sed 's/-all\.zip/-bin.zip/g')
          curl -4 -fL --connect-timeout 15 --max-time 60 --retry 3 "$GRADLE_URL" -o /tmp/gradle-bin.zip
          sed -i 's|distributionUrl=.*|distributionUrl=file\\:///tmp/gradle-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Compile Debug APK with Gradle
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProNote-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
